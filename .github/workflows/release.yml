name: Release

# Push a tag like v1.2.3 to publish a GitHub Release with builds for every browser.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: pnpm check

      - name: Build packages for Chrome, Firefox, Edge and Opera
        run: pnpm zip:all

      - name: Write checksums
        working-directory: .output
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$VERSION" > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" .output/*.zip .output/SHA256SUMS.txt \
            --title "Lari Rates $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag $prerelease
